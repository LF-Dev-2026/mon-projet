<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | LF-Dev-2026</title>
    <style>
        :root {
            --primary: #646cff;
            --accent: #00d2ff;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animation d'apparition */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .portfolio-card {
            background: var(--card);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.1) rotate(5deg);
        }

        h1 {
            margin: 0;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
        }

        .tag {
            background: rgba(100, 108, 255, 0.2);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            display: inline-block;
            margin: 10px 0;
        }
        #canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Met les particules derrière le texte */
    pointer-events: none;
}


        p {
            line-height: 1.6;
            color: #94a3b8;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .skill-item {
            font-size: 1.2rem;
            filter: grayscale(100%);
            transition: 0.3s;
        }

        .skill-item:hover {
            filter: grayscale(0%);
            transform: translateY(-5px);
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--primary);
            transition: 0.3s;
        }

        .back-btn:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>


    <div class="portfolio-card">
        <img src="logo.png" alt="LF-Dev" class="profile-img">
        <h1>LF-Dev-2026</h1>
        <div class="tag">Apprenti Développeur Web</div>
        
        <p>Passionné par la tech, je crée des interfaces modernes avec React. 
        C'est le framework plus demandé en 2026 .</p>

        <div class="skills">
            <span class="skill-item" title="React">⚛️</span>
            <span class="skill-item" title="JavaScript">📜</span>
            <span class="skill-item" title="HTML/CSS">🎨</span>
            <span class="skill-item" title="Termux">📱</span>
        </div>

        <a href="index.html" class="back-btn">← Retour à l'accueil</a>
    </div>
    <script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedY = Math.random() * 1 + 0.5;
        this.opacity = Math.random() * 0.5 + 0.2;
    }
    update() {
        this.y += this.speedY;
        if (this.y > canvas.height) this.y = 0;
    }
    draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function createParticles() {
    for (let i = 0; i < 100; i++) {
        particles.push(new Particle());
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(animate);
}

window.addEventListener('resize', init);
init();
createParticles();
animate();
</script>


</body>
</html>
